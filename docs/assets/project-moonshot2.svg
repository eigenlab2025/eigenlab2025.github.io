<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Organ networks and ultra-early disease prevention</title>
  <desc id="desc">A conceptual organ network, mathematical observations, and a protective health symbol illustrate medical research. The curves are schematic, not experimental results.</desc>
